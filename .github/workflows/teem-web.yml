          assets=['assets/teem_signature.png', 'assets/teem_logo_standalone.png', 'assets/teem_logo_master.png', 'assets/teem_logo_light.png', 'assets/teem.ico', 'assets/slide_recycling.jpg', 'assets/slide_community.jpg', 'assets/slide_collection.jpg', 'assets/jspdf.umd.min.js', 'assets/icon-512.png', 'assets/icon-192.png', 'assets/embedded_images.js', 'cloud/config.js']
          for n in assets:
           p=dest/n;p.parent.mkdir(exist_ok=True,parents=True);shutil.copyfile(n,p)
          # Retain the manifest start URL and the exact same origin, scope and data keys.
          entry=dest/'index.html';text=entry.read_text();needle='<button id="desktop-update-button"';require(text.count(needle)==1,'Update UI anchor missing');text=text.replace(needle,'<button type="button" id="teem-web-check" class="btn btn-outline">Check for updates</button>\n        '+needle);text=text.replace('</body>','<script src="web-updates.js"></script>\n</body>');(dest/'web-updates.js').write_text("(() => {\n const btn=document.getElementById('teem-web-check');let reg,checking=false,bar,last=0;\n function dismiss(){bar?.remove();bar=null;}\n function note(msg,buttons){dismiss();bar=document.createElement('aside');bar.setAttribute('role','status');bar.style.cssText='position:fixed;bottom:max(1rem,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:2147483647;background:#fff;color:#18382c;box-shadow:0 3px 18px #0005;padding:14px;border-radius:10px;width:min(92vw,400px);font:16px system-ui;';const text=document.createElement('p');text.style.margin='0 0 10px';text.textContent=msg;bar.append(text);for(const [label,fn] of buttons){const b=document.createElement('button');b.textContent=label;b.style.cssText='padding:7px 12px;margin-right:8px;';b.onclick=fn;bar.append(b);}document.body.append(bar);}\n function offer(){const w=reg?.waiting;if(!w || !navigator.serviceWorker.controller)return;note('A TEEM update is ready. Save any open form before reloading.',[['Update now',()=>{dismiss();let done=false;const reload=()=>{if(!done){done=true;location.reload();}};navigator.serviceWorker.addEventListener('controllerchange',reload,{once:true});w.addEventListener('statechange',()=>{if(w.state==='activated')reload();});w.postMessage('TEEM_APPLY');}],['Later',dismiss]]);}\n function watch(manual){const w=reg?.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed')setTimeout(offer,0);if(w.state==='redundant'&&manual)note('Update not ready. Your current version is still available.',[['OK',dismiss]]);});}\n async function ch