          name='TEEM-Windows-v'+ver+'.zip';require(meta['channel']=='teem-win64-portal-1' and meta['base']=='1.0.1' and meta['file']==name,'Incompatible native-only or legacy release');f=P('_release')/name; require(0<f.stat().st_size==meta['size']<=8*1024**2 and h(f.read_bytes())==meta['sha256'],'Release integrity mismatch');
