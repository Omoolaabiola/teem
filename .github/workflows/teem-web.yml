name: TEEM browser and iPhone update
on:
  workflow_dispatch:
  release:
    types: [published]
permissions: {}
concurrency:
  group: teem-web-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Read compatible assets from Latest (never publish a release)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ -n "$EVENT_TAG" ] && [ "$latest" != "$EVENT_TAG" ]; then echo 'Not the Latest release; no deployment'; exit 1; fi
          mkdir _release
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern 'update.json' --pattern 'TEEM-Windows-v*.zip' --dir _release
